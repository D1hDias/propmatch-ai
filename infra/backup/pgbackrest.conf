# OPS-12: pgBackRest configuration for PropMatch AI
# Backups stored in Cloudflare R2 (S3-compatible).
# Deploy to: /etc/pgbackrest/pgbackrest.conf on the VPS.
#
# Required env vars (set via systemd EnvironmentFile):
#   PGBACKREST_R2_KEY        — R2 Access Key ID
#   PGBACKREST_R2_SECRET     — R2 Secret Access Key
#   PGBACKREST_R2_BUCKET     — R2 bucket name (e.g. propmatch-backups)
#   PGBACKREST_R2_ENDPOINT   — R2 endpoint (e.g. https://<account>.r2.cloudflarestorage.com)
#   PGBACKREST_CIPHER_PASS   — AES-256 encryption passphrase (store in Vault / secrets manager)

[global]
repo1-type=s3
repo1-s3-key=%{PGBACKREST_R2_KEY}
repo1-s3-key-secret=%{PGBACKREST_R2_SECRET}
repo1-s3-bucket=%{PGBACKREST_R2_BUCKET}
repo1-s3-endpoint=%{PGBACKREST_R2_ENDPOINT}
repo1-s3-region=auto
repo1-s3-uri-style=path
repo1-path=/pgbackrest
repo1-retention-full=4
repo1-retention-diff=7
repo1-cipher-type=aes-256-cbc
repo1-cipher-pass=%{PGBACKREST_CIPHER_PASS}

# Logging
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

# Performance
process-max=2
compress-type=lz4
compress-level=6

[propmatch]
pg1-path=/var/lib/postgresql/16/main
pg1-user=postgres
