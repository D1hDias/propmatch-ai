services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: propmatch
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: propmatch_dev
    ports:
      - '5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U propmatch -d propmatch_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data
    command: redis-server --requirepass dev
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'dev', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
